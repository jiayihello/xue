[server]
HTTP_PORT = 8060
TOKEN = liukai00
LOG_LEVEL = INFO

[lxc]
DEFAULT_IMAGE_ALIAS = debian12
NETWORK_BRIDGE = lxdbr0
STORAGE_POOL = disk
DEFAULT_CONTAINER_USER = root
MAIN_INTERFACE = eth0
NAT_LISTEN_IP = 194.58.38.78
PORTMAP_SELFTEST_STRICT = false

# IPv4 配置
# IPV4_MODE 可选：BRIDGE | OFF
# - BRIDGE：容器连接到 lxdbr0 网桥，使用 NAT IPv4（默认）
# - OFF：不配置 IPv4 网络（适用于纯 IPv6 环境）
IPV4_MODE = BRIDGE

# IPv6 配置
# IPV6_MODE 可选：OFF | ROUTED | NAT66
# - OFF：禁用 IPv6 特性
# - ROUTED：需要 /64 前缀，容器将获得独立 /128（自动启用转发和 NDP 代理）
# - NAT66：无需 /64，端口转发自动同时创建 v4+v6；并自动配置 SNAT 让容器可通过 IPv6 出网（需设置 NAT_LISTEN_IPV6=/128）
IPV6_MODE = OFF

# 当 IPV6_MODE=ROUTED 时，填写你的 /64 前缀，例如 2001:db8:abcd:1234::/64
IPV6_PREFIX =

# IPv6 地址池（可选）：如果你有多个 /128 地址，可以在这里列出（用逗号或分号分隔）
# 系统会优先从地址池中分配，地址池耗尽后再从 IPV6_PREFIX 自动分配
# 示例：IPV6_ADDRESS_POOL = 2001:db8:1234::1, 2001:db8:1234::2, 2001:db8:1234::3
# 留空则直接从 IPV6_PREFIX 自动分配
IPV6_ADDRESS_POOL =

# 对外主网卡（不填则沿用 MAIN_INTERFACE）
IPV6_INTERFACE =

# 当 IPV6_MODE=NAT66 时，填写宿主用于对外监听的 /128（例如 2a01:db8::2）
# 留空则 IPv6 监听绑定到 ::（全部地址）
NAT_LISTEN_IPV6 =
