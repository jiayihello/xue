# OpenGFW 规则文件 - 轻量版
# 仅拦截最常见的代理协议
# 适用于性能敏感场景，最小化 CPU 开销

# ============================================
# 核心代理协议拦截
# ============================================

# 1. Shadowsocks / VMess
- name: block shadowsocks and vmess
  action: block
  log: true
  expr: fet != nil && fet.yes

# 2. Trojan 代理
- name: block trojan
  action: block
  log: true
  expr: trojan != nil && trojan.yes

# 3. Socks 代理
- name: block socks
  action: block
  log: true
  expr: socks != nil && socks.yes

# ============================================
# 说明
# ============================================
# 此配置仅拦截 3 种最常见的代理协议
# 如需更多保护，请使用"完全版"或"地域限制版"规则
# 修改规则后，执行: systemctl restart opengfw

